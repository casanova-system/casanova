{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid px-4 py-3">
    <!-- Cabeçalho da Página (A cor do título agora se adapta automaticamente ao tema claro/escuro) -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1 text-body">Gráfico: Custo de Frete</h2>
            <p class="text-muted small mb-0">Visualização gráfica dos custos de deslocamento por obra.</p>
        </div>
        <!-- Botão [001] removido conforme solicitado -->
    </div>

    <!-- Card Principal do Gráfico -->
    <div class="row">
        <div class="col-12">
            <div class="card card-custom p-4 border-0 shadow-sm" style="border-radius: 12px;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-semibold text-body mb-0">Evolução e Comparativo de Custos por Frete</h5>
                    <a href="{% url 'lista_obras' %}" class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i> Ver Tabela Completa
                    </a>
                </div>
                <hr class="text-muted opacity-25">
                
                <!-- Área do Gráfico -->
                <div style="height: 380px; position: relative;" class="w-100">
                    <canvas id="graficoFrete"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Importação do Chart.js via CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const canvasElement = document.getElementById('graficoFrete');
        if (!canvasElement) return;

        const ctx = canvasElement.getContext('2d');

        // Recebendo os dados limpos enviados pela View do Django
        const obrasList = JSON.parse('{{ obras_json|safe }}');

        const labelsNomes = obrasList.map(item => item.nome);
        const dadosCustos = obrasList.map(item => item.custo_total_deslocamento);

        // Detectar se o sistema está em modo claro ou escuro para ajustar as cores dos eixos do gráfico dinamicamente
        const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        // Ou verificando classe do body se o seu template usar classes como 'dark-mode' / 'light-mode'
        const textColor = document.body.classList.contains('bg-dark') || document.documentElement.getAttribute('data-bs-theme') === 'dark' ? '#adb5bd' : '#495057';
        const gridColor = document.createElement('div'); // cor neutra adaptável
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labelsNomes,
                datasets: [{
                    label: 'Custo Total de Deslocamento (R$)',
                    data: dadosCustos,
                    backgroundColor: 'rgba(13, 110, 253, 0.75)',
                    borderColor: 'rgba(13, 110, 253, 1)',
                    borderWidth: 2,
                    borderRadius: 6,
                    hoverBackgroundColor: 'rgba(13, 110, 253, 0.95)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: textColor,
                            font: { family: 'Inter', size: 12 }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let value = context.parsed.y || 0;
                                return ' Custo: R$ ' + value.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: textColor, font: { size: 11 } },
                        grid: { color: 'rgba(108, 117, 125, 0.15)' }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: { 
                            color: textColor,
                            callback: function(value) {
                                return 'R$ ' + value.toLocaleString('pt-BR');
                            }
                        },
                        grid: { color: 'rgba(108, 117, 125, 0.15)' }
                    }
                }
            }
        });
    });
</script>
{% endblock %}
