{% extends 'core/base.html' %}
{% load static %}
{% block content %}
<div class="container-fluid px-4 py-3">
    {% include 'core/partials/messages.html' %}
    <form method="POST">
        {% csrf_token %}
        <div class="card mb-3">
            <div class="card-header fw-bold">Editar OP {{ op.codigo }}</div>
            <div class="card-body">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="pausada_material" id="pausada_material" {% if op.pausada_material %}checked{% endif %}>
                    <label class="form-check-label" for="pausada_material">Pausada por falta de material</label>
                </div>
            </div>
        </div>
        <div class="text-end">
            <a href="{% url 'lista_ordem_producao' %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i> Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
