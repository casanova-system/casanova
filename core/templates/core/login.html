{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CASANOVA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            background-color: #0d1117;
            background-image: radial-gradient(circle at 10% 20%, rgba(35, 134, 54, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(88, 166, 255, 0.08) 0%, transparent 40%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .login-container {
            display: flex;
            width: 950px;
            max-width: 95%;
            height: 540px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Lado esquerdo (Inteiro Branco) */
        .login-left {
            flex: 1.1;
            background: #ffffff;
            color: #24292e;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-right: 1px solid #d1d5db;
        }

        .system-logo {
            width: 280px;
            height: auto;
            margin-bottom: 20px;
            display: block;
        }

        .login-left p {
            font-size: 14px;
            color: #57606a;
            margin-bottom: 0;
            letter-spacing: 0.3px;
            font-weight: 500;
        }

        /* Lado direito (Formulário) */
        .login-right {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #161b22;
            color: #c9d1d9;
        }

        .login-right h3 {
            font-weight: 700;
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 25px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #8b949e;
            letter-spacing: 0.3px;
        }

        .form-control {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #ffffff;
            padding: 12px 15px;
            border-radius: 0 10px 10px 0;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background-color: #0d1117;
            border-color: #58a6ff;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .input-group-text {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            border-radius: 10px 0 0 10px;
            padding: 0 15px;
        }

        .btn-custom {
            background-color: #238636;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
        }

        .btn-custom:hover {
            background-color: #2ea043;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(35, 134, 54, 0.4);
            color: white;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                height: auto;
            }
            .login-left {
                padding: 30px;
                border-right: none;
                border-bottom: 1px solid #30363d;
            }
            .login-right {
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Lado Esquerdo: Bloco inteiro branco com a logo e texto escuro -->
        <div class="login-left">
            <img src="{% static 'img/logologin.png' %}" alt="Casanova Logo" class="system-logo">
            <p>Faça login para gerenciar suas operações.</p>
        </div>

        <!-- Lado Direito: Formulário de Acesso -->
        <div class="login-right">
            <h3>Área Restrita</h3>

            {% if erro %}
                <div class="alert alert-danger bg-opacity-25 border-danger text-danger py-2 small text-center rounded-3 mb-3" role="alert">
                    {{ erro }}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Digite seu usuário" required autofocus>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Digite sua senha" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-custom w-100">Entrar no Sistema</button>
            </form>
        </div>
    </div>

</body>
</html>
