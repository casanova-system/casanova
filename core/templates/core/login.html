<html lang="pt-br" data-bs-theme="light"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso | CASANOVA Esquadrias</title>
    <script>
        (function () {
            const temaSalvo = localStorage.getItem('casanova_theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', temaSalvo);

            // Mantem a paleta de cor escolhida pelo usuario (padrao: azul)
            const paletaSalva = localStorage.getItem('casanova_palette') || 'azul';
            document.documentElement.setAttribute('data-palette', paletaSalva);
        })();
    </script>
    <link rel="icon" type="image/png" href="/static/img/logo_semfundo.png?v=2">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/fontes.css?v=20261015b">
    <style>
        :root {
            /* Paleta de marca (trocada via [data-palette]) */
            --cv-brand-rgb: 11, 56, 130;
            --cv-brand-dark-rgb: 6, 34, 84;
            --cv-brand-light-rgb: 88, 166, 255;
            --cv-accent: rgb(var(--cv-brand-light-rgb));

            --casanova-blue: rgb(var(--cv-brand-rgb));
            --casanova-dark-blue: rgb(var(--cv-brand-dark-rgb));
            --page-bg: #f4f6f9;
            --page-text: #1e293b;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --muted: #64748b;
            --input-bg: #ffffff;
            --input-border: #d0d7de;
            --input-text: #212529;
            --input-placeholder: #94a3b8;
            --addon-bg: #f8fafc;
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            --btn-shadow: 0 8px 20px rgba(var(--cv-brand-rgb), 0.28);
        }


        /* Paletas de cor da marca (identidade padrao: azul) */
        [data-palette="azul"] { --cv-brand-rgb: 11, 56, 130; --cv-brand-dark-rgb: 6, 34, 84; --cv-brand-light-rgb: 88, 166, 255; }
        [data-palette="roxo"] { --cv-brand-rgb: 109, 40, 217; --cv-brand-dark-rgb: 76, 29, 149; --cv-brand-light-rgb: 167, 139, 250; }
        [data-palette="rosa"] { --cv-brand-rgb: 219, 39, 119; --cv-brand-dark-rgb: 157, 23, 77; --cv-brand-light-rgb: 244, 114, 182; }
        [data-palette="verde"] { --cv-brand-rgb: 4, 120, 87; --cv-brand-dark-rgb: 6, 78, 59; --cv-brand-light-rgb: 52, 211, 153; }
        [data-palette="laranja"] { --cv-brand-rgb: 194, 65, 12; --cv-brand-dark-rgb: 124, 45, 18; --cv-brand-light-rgb: 251, 146, 60; }

        [data-bs-theme="dark"] {
            --page-bg: #0d1117;
            --page-text: #e6edf3;
            --card-bg: #161b22;
            --card-border: #30363d;
            --muted: #8b949e;
            --input-bg: #0d1117;
            --input-border: #30363d;
            --input-text: #f0f6fc;
            --input-placeholder: #6e7681;
            --addon-bg: #21262d;
            --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            --btn-shadow: 0 8px 22px rgba(var(--cv-brand-rgb), 0.24);
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            font-family: var(--cv-font);
            background: var(--page-bg);
            color: var(--page-text);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image:
                radial-gradient(ellipse at top left, rgba(var(--cv-brand-rgb), 0.10), transparent 42%),
                radial-gradient(ellipse at bottom right, rgba(var(--cv-brand-light-rgb), 0.10), transparent 46%);
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        [data-bs-theme="dark"] body {
            background-image:
                radial-gradient(ellipse at top left, rgba(var(--cv-brand-light-rgb), 0.14), transparent 42%),
                radial-gradient(ellipse at bottom right, rgba(var(--cv-brand-rgb), 0.22), transparent 46%);
        }

        .login-theme-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.35s ease, border-color 0.35s ease;
        }

        .login-theme-btn:hover {
            transform: translateY(-1px);
            color: var(--casanova-blue);
        }

        [data-bs-theme="dark"] .login-theme-btn:hover {
            color: #58a6ff;
        }

        #icone-tema {
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .spin-icon {
            transform: rotate(360deg) scale(1.15);
        }

        .login-shell {
            width: 980px;
            max-width: 100%;
            min-height: 560px;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: loginIn 0.55s ease both;
        }

        @keyframes loginIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-brand {
            position: relative;
            padding: 48px 44px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #fff;
            background: linear-gradient(145deg, var(--cv-blue-dark, rgb(var(--cv-brand-dark-rgb))) 0%, var(--cv-blue-dark, rgb(var(--cv-brand-dark-rgb))) 100%);
        }

        .login-brand::after {
            content: '';
            position: absolute;
            inset: auto 0 0 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #60a5fa, transparent);
        }

        .brand-kicker {
            font-size: 0.72rem;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 500;
        }

        .brand-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin: 28px 0 18px;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.25));
        }

        .brand-title {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            line-height: 1.15;
        }

        .brand-title span {
            font-weight: 300;
            color: #60a5fa;
        }

        .brand-copy {
            margin-top: 16px;
            max-width: 340px;
            color: rgba(226, 232, 240, 0.78);
            font-size: 0.9rem;
            line-height: 1.55;
        }

        .brand-foot {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.42);
            letter-spacing: 0.4px;
        }

        .login-form-pane {
            padding: 48px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-kicker {
            color: var(--casanova-blue);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        [data-bs-theme="dark"] .form-kicker {
            color: #58a6ff;
        }

        .form-title {
            font-size: 1.55rem;
            font-weight: 700;
            margin: 0 0 6px;
            color: var(--page-text);
        }

        .form-lead {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        .input-group-text {
            background: var(--addon-bg);
            border: 1px solid var(--input-border);
            color: var(--muted);
            border-right: 0;
        }

        .form-control {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--input-text);
            padding: 12px 14px;
            font-size: 0.92rem;
        }

        .form-control::placeholder {
            color: var(--input-placeholder);
        }

        .form-control:focus {
            background: var(--input-bg);
            color: var(--input-text);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(var(--cv-brand-rgb), 0.18);
        }

        .input-group:focus-within .input-group-text {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .btn-toggle-pass {
            background: var(--addon-bg);
            border: 1px solid var(--input-border);
            border-left: 0;
            color: var(--muted);
        }

        .btn-toggle-pass:hover {
            color: var(--page-text);
        }

        .btn-login {
            margin-top: 8px;
            background: linear-gradient(135deg, rgb(var(--cv-brand-rgb)) 0%, rgb(var(--cv-brand-dark-rgb)) 100%);
            border: 0;
            color: #fff;
            font-weight: 600;
            padding: 13px;
            border-radius: 10px;
            box-shadow: var(--btn-shadow);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.25s ease;
        }

        /* Brilho que atravessa o botão no hover */
        .btn-login::after {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 60%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,0.28), transparent);
            transform: skewX(-18deg);
            transition: left 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-login:hover::after {
            left: 130%;
        }

        .btn-login:hover {
            color: #fff;
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 14px 30px rgba(var(--cv-brand-rgb), 0.34);
        }
        .btn-login:active {
            transform: translateY(0) scale(0.99);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Entrada escalonada dos campos do formulário */
        .login-form-pane .form-kicker,
        .login-form-pane .form-title,
        .login-form-pane .form-lead,
        .login-form-pane form > * {
            animation: loginFieldIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .login-form-pane .form-kicker { animation-delay: 0.05s; }
        .login-form-pane .form-title  { animation-delay: 0.10s; }
        .login-form-pane .form-lead   { animation-delay: 0.15s; }
        .login-form-pane form > *:nth-child(1) { animation-delay: 0.20s; }
        .login-form-pane form > *:nth-child(2) { animation-delay: 0.26s; }
        .login-form-pane form > *:nth-child(3) { animation-delay: 0.32s; }

        @keyframes loginFieldIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo com entrada suave */
        .brand-logo {
            animation: logoIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes logoIn {
            from { opacity: 0; transform: scale(0.9) translateY(6px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .alert-login {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.28);
            color: #dc2626;
            font-size: 0.86rem;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 18px;
        }

        [data-bs-theme="dark"] .alert-login {
            color: #f87171;
        }

        /* Alerta de erro com leve tremor */
        .alert {
            animation: alertShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }
        @keyframes alertShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-form-pane .form-kicker,
            .login-form-pane .form-title,
            .login-form-pane .form-lead,
            .login-form-pane form > *,
            .brand-logo,
            .alert {
                animation: none !important;
            }
            .btn-login::after { display: none; }
        }

        @media (max-width: 860px) {
            .login-shell {
                grid-template-columns: 1fr;
                min-height: 0;
            }
            .login-brand {
                padding: 32px 28px 28px;
                min-height: 220px;
            }
            .login-form-pane {
                padding: 32px 28px 36px;
            }
            .brand-copy {
                display: none;
            }
        }
    </style>
</head>
<body>
    <button type="button" class="login-theme-btn" id="btn-tema" title="Alternar tema" aria-label="Alternar tema">
        <i class="fa-solid fa-moon text-secondary" id="icone-tema"></i>
    </button>

    <div class="login-shell">
        <section class="login-brand">
            <div>
                <div class="brand-kicker">
                    <i class="fa-solid fa-shield-halved me-1"></i> portal interno casanova
                </div>
                <img src="/static/img/logo_semfundo.png?v=2" alt="Casanova" class="brand-logo">
                <h1 class="brand-title">CASANOVA <span>ESQUADRIAS</span></h1>
                <p class="brand-copy">
                    Bem-Vindo(a)!
                </p>
            </div>
            <div class="brand-foot">© 2026 Casanova Esquadrias · System V.1.0</div>
        </section>

        <section class="login-form-pane">
            <div class="form-kicker">Painel de acesso</div>
            <h2 class="form-title">Entrar no sistema</h2>
            <p class="form-lead">Informe usuário e senha para acessar as rotinas liberadas para o seu perfil.</p>

            {% if erro %}
            <div class="alert {% if bloqueado %}alert-danger{% else %}alert-warning{% endif %} d-flex align-items-center gap-2 py-2 px-3 mb-3" role="alert" style="font-size: 0.85rem; border-radius: 10px;">
                <i class="fa-solid {% if bloqueado %}fa-lock{% else %}fa-triangle-exclamation{% endif %}"></i>
                <span>{{ erro }}</span>
            </div>
            {% endif %}

            <form method="POST" autocomplete="on">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Nome de usuário" value="{{ username|default:'' }}" required="" autofocus="" {% if bloqueado %}disabled{% endif %}>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="id_password">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" id="id_password" class="form-control" placeholder="Digite sua senha" required="" {% if bloqueado %}disabled{% endif %}>
                        <button class="btn btn-toggle-pass" type="button" id="btn-toggle-senha" title="Mostrar senha" aria-label="Mostrar senha">
                            <i class="fa-regular fa-eye" id="icone-senha"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100" {% if bloqueado %}disabled{% endif %}>
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Acessar sistema
                </button>
            </form>
        </section>
    </div>

    <script>
        const htmlElement = document.documentElement;
        const btnTema = document.getElementById('btn-tema');
        const iconeTema = document.getElementById('icone-tema');

        function atualizarIcone(tema, animar) {
            iconeTema.className = (tema === 'dark'
                ? 'fa-solid fa-sun text-warning'
                : 'fa-solid fa-moon text-secondary') + (animar ? ' spin-icon' : '');
        }

        atualizarIcone(localStorage.getItem('casanova_theme') || 'light', false);

        btnTema.addEventListener('click', () => {
            const temaAtual = htmlElement.getAttribute('data-bs-theme');
            const novoTema = temaAtual === 'dark' ? 'light' : 'dark';
            iconeTema.classList.add('spin-icon');
            setTimeout(() => {
                htmlElement.setAttribute('data-bs-theme', novoTema);
                localStorage.setItem('casanova_theme', novoTema);
                atualizarIcone(novoTema, true);
                setTimeout(() => iconeTema.classList.remove('spin-icon'), 250);
            }, 150);
        });

        const btnSenha = document.getElementById('btn-toggle-senha');
        const inputSenha = document.getElementById('id_password');
        const iconeSenha = document.getElementById('icone-senha');
        btnSenha.addEventListener('click', () => {
            const visivel = inputSenha.type === 'text';
            inputSenha.type = visivel ? 'password' : 'text';
            iconeSenha.className = visivel ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
            btnSenha.title = visivel ? 'Mostrar senha' : 'Ocultar senha';
        });
    </script>


</body></html>
