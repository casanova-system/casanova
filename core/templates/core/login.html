{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Login - CASANOVA</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo_semfundo.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(15px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        :root {
            --bg-base: #090d16;
            --card-bg: #111827;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-blue: #3b82f6;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(13, 110, 253, 0.07) 0%, transparent 45%),
                linear-gradient(to bottom, #090d16, #030712);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .login-container {
            display: flex;
            width: 980px;
            max-width: 94%;
            height: 560px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(59, 130, 246, 0.05);
            overflow: hidden;
            animation: fadeInScale 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Lado esquerdo - Identidade Visual */
        .login-left {
            flex: 1.1;
            background: linear-gradient(145deg, #0f172a 0%, #090d16 100%);
            color: #ffffff;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-right: 1px solid var(--border-color);
            position: relative;
        }

        .login-left::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
        }

        .brand-logo-wrapper {
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 16px rgba(59, 130, 246, 0.3));
        }

        .brand-logo-wrapper img {
            max-height: 100px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            font-weight: 800;
            color: #ffffff;
            font-size: 32px;
            letter-spacing: 4px;
            margin-bottom: 2px;
        }

        .brand-subtitle {
            font-weight: 500;
            color: #93c5fd;
            font-size: 11px;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .login-left p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 0;
            letter-spacing: 0.3px;
            font-weight: 400;
            line-height: 1.5;
            max-width: 320px;
        }

        /* Lado direito - Formulário Executivo */
        .login-right {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #111827;
            color: #f3f4f6;
        }

        .login-header {
            margin-bottom: 25px;
        }

        .login-header h3 {
            font-weight: 800;
            font-size: 24px;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header .form-sub-tag {
            font-weight: 500;
            color: var(--accent-blue);
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 0;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .form-control {
            background-color: #0b0f19;
            border: 1px solid #1f293d;
            color: #ffffff;
            padding: 12px 15px;
            font-size: 14px;
            border-radius: 0 10px 10px 0;
            transition: all 0.25s ease;
        }

        .form-control::placeholder {
            color: #4b5563;
        }

        .form-control:focus {
            background-color: #0b0f19;
            border-color: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .input-group-text {
            background-color: #161f33;
            border: 1px solid #1f293d;
            color: #94a3b8;
            border-radius: 10px 0 0 10px;
            padding: 0 16px;
        }

        .btn-custom {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 13px;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
            letter-spacing: 0.3px;
        }

        .btn-custom:hover {
            background: linear-gradient(135deg, #1d4ed8 100%, #1e40af 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            color: white;
        }

        .alert-custom {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            font-size: 13px;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                height: auto;
                max-width: 90%;
            }
            .login-left {
                padding: 30px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .login-right {
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Lado Esquerdo: Logo em Imagem -->
        <div class="login-left">
            <div class="brand-logo-wrapper">
                <img src="{% static 'img/logo_semfundo.png' %}" alt="Casanova Esquadrias">
            </div>
            <h1 class="brand-title">CASANOVA</h1>
            <span class="brand-subtitle">ESQUADRIAS</span>
            <p>copyright © 2026.</p>
        </div>

        <!-- Lado Direito: Formulário com Título Elaborado -->
        <div class="login-right">
            <div class="login-header">
                <span class="form-sub-tag">Painel de Acesso</span>
                <h3>Casanova Esquadrias</h3>
                <p>Insira suas credenciais corporativas para continuar</p>
            </div>

            {% if erro %}
                <div class="alert alert-custom" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ erro }}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user-shield"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Seu nome de usuário" required autofocus>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-custom w-100">
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Acessar Sistema
                </button>
            </form>
        </div>
    </div>

</body>
</html>
