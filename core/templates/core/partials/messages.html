{% comment %}
Bloco de mensagens do sistema + script de auto-close padronizado.
Uso: {% include 'core/partials/messages.html' %}
{% endcomment %}
{% if messages %}
    <div class="mb-3 flex-shrink-0">
        {% for message in messages %}
            {% if forloop.last %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show py-2 small" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                </div>
            {% endif %}
        {% endfor %}
    </div>
{% endif %}
<script>
    setTimeout(function () {
        document.querySelectorAll('.alert:not(.alert-warning)').forEach(function (alerta) {
            new bootstrap.Alert(alerta).close();
        });
    }, 2000);
</script>
