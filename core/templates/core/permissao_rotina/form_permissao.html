{% extends 'core/base.html' %}

{% block content %}
<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
        <h3 class="text-light fw-bold"><i class="fas fa-user-lock me-2"></i> Configurar Permissões: {{ usuario_obj.username }}</h3>
        <a href="{% url 'lista_permissao' %}" class="btn btn-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Voltar
        </a>
    </div>

    <div class="card shadow bg-dark text-light border-secondary mb-4">
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                
                <div class="row mb-4">
                    <!-- Nível de Acesso -->
                    <div class="col-md-6">
                        <label class="form-label text-light fw-semibold">Nível de Acesso *</label>
                        <select name="nivel_acesso" class="form-select bg-dark text-light border-secondary">
                            <option value="DIRETORIA" {% if perfil.nivel_acesso == 'DIRETORIA' %}selected{% endif %}>Diretoria</option>
                            <option value="GERENCIA" {% if perfil.nivel_acesso == 'GERENCIA' %}selected{% endif %}>Gerência</option>
                            <option value="USUARIO" {% if perfil.nivel_acesso == 'USUARIO' %}selected{% endif %}>Usuário</option>
                        </select>
                    </div>

                    <!-- Setor -->
                    <div class="col-md-6">
                        <label class="form-label text-light fw-semibold">Setor *</label>
                        <select name="setor" class="form-select bg-dark text-light border-secondary">
                            <option value="COMERCIAL" {% if perfil.setor == 'COMERCIAL' %}selected{% endif %}>Comercial</option>
                            <option value="FINANCEIRO" {% if perfil.setor == 'FINANCEIRO' %}selected{% endif %}>Financeiro</option>
                            <option value="OPERACAO" {% if perfil.setor == 'OPERACAO' %}selected{% endif %}>Operação</option>
                            <option value="ADMINISTRACAO" {% if perfil.setor == 'ADMINISTRACAO' %}selected{% endif %}>Administração</option>
                        </select>
                    </div>
                </div>

                <!-- Seleção de Rotinas Permitidas -->
                <div class="mb-4">
                    <label class="form-label text-light fw-bold fs-5 mb-2">
                        <i class="fas fa-check-square text-primary me-2"></i> Rotinas Permitidas para o Usuário
                    </label>
                    <div class="p-3 border border-secondary rounded bg-black bg-opacity-25">
                        <div class="row">
                            {% for rotina in todas_rotinas %}
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input bg-dark border-secondary" type="checkbox" name="rotinas" value="{{ rotina.id }}" id="rotina_{{ rotina.id }}"
                                            {% if rotina in perfil.rotinas_permitidas.all %}checked{% endif %}>
                                        <label class="form-check-label text-light" for="rotina_{{ rotina.id }}">
                                            <span class="text-info fw-bold">{{ rotina.codigo }}</span> {{ rotina.nome }}
                                        </label>
                                    </div>
                                </div>
                            {% empty %}
                                <p class="text-muted">Nenhuma rotina cadastrada no sistema. Cadastre as rotinas no Django Admin primeiro.</p>
                            {% endfor %}
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'lista_permissao' %}" class="btn btn-secondary px-4">
                        <i class="fas fa-arrow-left me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-success px-4">
                        <i class="fas fa-save me-1"></i> Salvar Permissões
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
