{% extends 'core/base.html' %}

{% block content %}
<style>
    /* Estilo customizado para o botão de cancelar/outline na tela de upload */
    .btn-outline-secondary-custom {
        border-width: 1px;
        font-weight: 500;
        transition: all 0.3s ease;
    }
    [data-bs-theme="light"] .btn-outline-secondary-custom {
        color: #495057 !important;
        background-color: #ffffff !important;
        border-color: #ced4da !important;
    }
    [data-bs-theme="light"] .btn-outline-secondary-custom:hover {
        color: #212529 !important;
        background-color: #e2e6ea !important;
        border-color: #dae0e5 !important;
    }
    [data-bs-theme="dark"] .btn-outline-secondary-custom {
        color: #f8f9fa !important;
        background-color: #1e2638 !important;
        border-color: #2d3748 !important;
    }
    [data-bs-theme="dark"] .btn-outline-secondary-custom:hover {
        background-color: #2d3748 !important;
        color: #ffffff !important;
    }

    /* Correção para o input de arquivo se adaptar perfeitamente aos temas */
    input[type="file"].form-control {
        background-color: var(--bs-body-bg) !important;
        color: var(--bs-body-color) !important;
        border-color: var(--bs-border-color) !important;
    }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-file-pdf text-danger fa-3x mb-2"></i>
                        <h4 class="fw-bold">Importar Relatório PDF</h4>
                        <p class="text-muted small">Selecione o arquivo do orçamento em PDF para realizar o processamento automático.</p>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger py-2" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="pdf_file" class="form-label fw-semibold">Arquivo PDF</label>
                            <input class="form-control" type="file" id="pdf_file" name="excel_file" accept=".pdf, application/pdf" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-casanova text-white">
                                <i class="fa-solid fa-gears me-1"></i> Processar PDF
                            </button>
                            <a href="{% url 'lista_obras' %}" class="btn btn-outline-secondary-custom">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
