{% extends 'core/base.html' %}  <!-- Ou 'core/base_frete.html', dependendo de qual você usa nas outras telas -->

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <!-- Adicionado bg-dark text-light e border-secondary para seguir o tema escuro -->
            <div class="card shadow bg-dark text-light border-secondary">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4 text-light fw-bold">Criar Nova Conta</h3>
                    
                    {% if erro %}
                        <div class="alert alert-danger" role="alert">
                            {{ erro }}
                        </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-light">Usuário:</label>
                            <!-- bg-dark text-light border-secondary adicionados no input -->
                            <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">E-mail:</label>
                            <input type="email" name="email" class="form-control bg-dark text-light border-secondary" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">Senha:</label>
                            <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required>
                        </div>

                        <!-- Botão com cor primária padronizada -->
                        <button type="submit" class="btn btn-primary w-100 mt-2">Cadastrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
